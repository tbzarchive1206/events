name: Sync Events Archive

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: events-archive-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Google Drive
        run: pnpm run sync:drive
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      - run: pnpm test
      - name: Commit changed archive index
        run: |
          if git diff --quiet -- app/data/archive.generated.json; then exit 0; fi
          git config user.name "events-archive-bot"
          git config user.email "events-archive-bot@users.noreply.github.com"
          git add app/data/archive.generated.json
          git commit -m "chore: sync Events archive"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Deploy synchronized archive to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
